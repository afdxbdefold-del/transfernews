<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <!-- transfernews logo - ultra minimal, bold sans-serif -->
  <style>
    .logo-text { 
      font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; 
      font-weight: 800; 
      font-size: 36px;
      letter-spacing: -1.5px;
    }
  </style>
  
  <!-- "transfer" in dark gray -->
  <text x="0" y="42" class="logo-text" fill="#1a1a1a">transfer</text>
  
  <!-- "news" in brand green -->
  <text x="156" y="42" class="logo-text" fill="#79B92A">news</text>
  
  <!-- Subtle arrow integrated into "t" crossbar -->
  <rect x="6" y="16" width="18" height="4" fill="#79B92A"/>
  <polygon points="24,18 28,13 28,23" fill="#79B92A"/>
</svg>