# Docker service addresses change when Coolify replaces application containers.
# nginx >= 1.27.3 resolves these upstreams at runtime without a frontend restart.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;
upstream backend_api {
    zone transfernews_api 64k;
    server backend:8001 resolve;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    send_timeout 60s;
    keepalive_timeout 65s;

    # Render the branded client 404 while keeping the HTTP status.
    error_page 404 /index.html;

    location = /index.html {
        try_files $uri =404;
    }

    location = / {
        try_files /index.html =404;
    }

    # Only declared application routes may receive a successful SPA shell.
    location ~ ^/(news|ticker|top-deals|abloesefrei|deadline-day|geruechte|transfers|suche|redaktion|impressum|ueber-uns|datenschutz)/?$ {
        try_files /index.html =404;
    }

    location ~ ^/admin(?:/(?:login|passwort|players|clubs|competitions|sources|events|articles|ad-slots|transfers|rumours|gsc))?/?$ {
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }

    # Public SEO endpoints must not fall through to the React shell.
    location ~ ^/(robots[.]txt|sitemap[.]xml|news-sitemap[.]xml|sitemap-index[.]xml)$ {
        rewrite ^/(.*)$ /api/$1 break;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
    }

    # The backend validates each entity and supplies its metadata or a real 404.
    location ~ ^/(news|spieler|verein|wettbewerb|autor|thema)/[^/]+/?$ {
        rewrite ^/(.*)$ /api/ssr/$1 break;
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /ads.txt {
        proxy_pass http://backend_api/ads.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /static {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        access_log off;
        return 200 "OK";
        add_header Content-Type text/plain;
    }
}
