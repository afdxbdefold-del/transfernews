name: Transfernews production monitor

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-monitor.yml'
      - 'deploy/public_monitor.py'

permissions:
  contents: read

concurrency:
  group: transfernews-production-monitor
  cancel-in-progress: false

jobs:
  public-health:
    # Standard runners are free for this public repository. Do not run if made private.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, Node 24
        with:
          persist-credentials: false
      - name: Check public availability and actual pipeline diagnostics
        run: python3 deploy/public_monitor.py
