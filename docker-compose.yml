services:
  mongodb:
    image: mongo:7
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - app-network

  backend:
    build: ./backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=transfernews_db
      - CORS_ORIGINS=https://transfernews.de,https://www.transfernews.de
    depends_on:
      - mongodb
    restart: always
    networks:
      - app-network

  frontend:
    build: ./frontend
    restart: always
    networks:
      - app-network

  caddy:
    build: ./caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - app-network

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
