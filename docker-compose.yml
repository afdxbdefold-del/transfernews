services:
  mongodb:
    image: mongo:7
    container_name: transfernews-db
    volumes:
      - mongodb_data:/data/db
    restart: always
    networks:
      - app-network

  backend:
    build: ./backend
    container_name: transfernews-backend
    environment:
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=transfernews_db
      - CORS_ORIGINS=https://transfernews.de,https://www.transfernews.de
    depends_on:
      - mongodb
    restart: always
    networks:
      - app-network

  frontend:
    image: nginx:alpine
    container_name: transfernews-frontend
    volumes:
      - ./frontend/build:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    networks:
      - app-network

  caddy:
    image: caddy:alpine
    container_name: transfernews-proxy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    restart: always
    networks:
      - app-network

volumes:
  mongodb_data:
  caddy_data:
  caddy_config:

networks:
  app-network:
    driver: bridge
